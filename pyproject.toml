[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aircraft-geoloc-reproduction"
version = "0.1.0"
description = "Reproducible physics-based aircraft acoustic geolocation"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "soundfile", "pyproj", "rasterio", "matplotlib", "requests", "pyarrow"]

[project.scripts]
aircraft-geoloc = "aircraft_geoloc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
