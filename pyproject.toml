[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dopplergeist"
version = "0.1.0"
description = "Reproducible physics-based aircraft acoustic geolocation"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "licenses/MIT-legacy.txt", "src/dopplergeist/web/leaflet-license.txt"]
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "soundfile", "pyproj", "rasterio", "matplotlib", "requests", "pyarrow"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dopplergeist = "dopplergeist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dopplergeist.web" = ["*.html", "*.js", "*.css", "leaflet-license.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
