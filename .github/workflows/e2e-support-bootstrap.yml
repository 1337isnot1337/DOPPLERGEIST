name: E2E support workspace
on:
  push:
    branches: [worker/e2e-track-support-20261103]
    paths: [.github/workflows/e2e-support-bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Clone the current public repository with full history
        run: |
          git clone --mirror https://github.com/1337isnot1337/DOPPLERGEIST.git repository.git
          git -C repository.git fsck --full
          git -C repository.git bundle create ../dopplergeist-updated.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-updated-repository
          path: dopplergeist-updated.bundle
          retention-days: 7
          if-no-files-found: error
