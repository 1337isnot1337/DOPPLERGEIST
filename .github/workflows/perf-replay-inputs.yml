name: Real performance replay inputs
on:
  push:
    branches: [perf/measured-hotpath-20261103]
    paths: [.github/workflows/perf-replay-inputs.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install .
      - name: Restore public real observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_artifacts.py --bundle data-source --bundle data-adsb-derived --bundle data-terrain
      - name: Prepare reusable regional index
        run: python scripts/prepare_reference_upload.py --data-root data --output performance-inputs
      - name: Download public offline dependency wheels
        run: python -m pip download --dest performance-inputs/wheels pyproj pyarrow rasterio soundfile pytest
      - name: Package inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, tarfile
          root = Path('.')
          with tarfile.open('real-performance-inputs.tar.gz', 'w:gz', compresslevel=3) as out:
              for name in ('performance-inputs', 'data/source', 'data/terrain'):
                  out.add(root / name, arcname=name)
          print('bundle_bytes', Path('real-performance-inputs.tar.gz').stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: real-performance-inputs
          path: real-performance-inputs.tar.gz
          compression-level: 0
          retention-days: 3
