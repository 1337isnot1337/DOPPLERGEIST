name: Fresh install and real end-to-end verification
on:
  push:
    branches: [worker/e2e-nasa-highspeed-inputs-20261103]
    paths: [.github/workflows/e2e-real-final.yml]
permissions:
  contents: read
env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  real-methodology:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4b2485b7c2773665e8e180b6bf840eac3c187431
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve the complete repository for the implementation workspace
        run: |
          mkdir -p final-artifacts
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git bundle create final-artifacts/dopplergeist-final.bundle --all
          git rev-parse HEAD > final-artifacts/source-commit.txt
      - name: Install published package and browser verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg gh
          python -m pip install . playwright
          python -m pip check
          python -m compileall -q src scripts
          dopplergeist --help
          python -I - <<'PY'
          from pathlib import Path
          from importlib import resources
          import dopplergeist
          assert 'site-packages' in Path(dopplergeist.__file__).parts
          for name in ('index.html','app.js','style.css'):
              assert resources.files('dopplergeist.web').joinpath(name).read_bytes()
          print('Installed package and browser assets are available.')
          PY
          python -m playwright install --with-deps chromium
      - name: Restore the original real recording and measured regional inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_ci_checkpoint.py --destination . --receipt final-artifacts/restore.json
      - name: Run the installed configured methodology on unchanged real inputs
        run: dopplergeist run data/source/reproduce-local.json --output results/final-real-pipeline
      - name: Compare the completed research ranking with the historical baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from pyproj import Geod
          report=json.loads(Path('results/final-real-pipeline/report.json').read_text())
          baseline=json.loads(Path('evidence/results/reference-local-fast/report.json').read_text())['best']
          best=report['best']
          distance=Geod(ellps='WGS84').inv(best['lon'],best['lat'],baseline['lon'],baseline['lat'])[2]
          reference_distance=Geod(ellps='WGS84').inv(best['lon'],best['lat'],-73.5247,40.8766)[2]
          assert distance<=2,distance
          assert best['flight_ids']==baseline['flight_ids']
          assert abs(best['recording_start_time_s']-baseline['recording_start_time_s'])<=0.05
          assert abs(best['score']-baseline['score'])<=1e-4
          assert report['accepted_location'] is False
          assert report['model_support_complete'] is False
          assert report['model_assessment_complete'] is False
          print(json.dumps({'baseline_reproduced':True,'baseline_displacement_m':distance,
             'published_reference_distance_m':reference_distance,'elapsed_s':report['elapsed_s'],
             'ranked_points':report['ranked_points'],'accepted_location':False,
             'scope':'source-informed configured research reproduction; independent automatic accuracy unverified'}))
          PY
      - name: Convert the complete real WAV to MP3 without selecting events or bands
        run: ffmpeg -hide_banner -loglevel error -i data/source/reference-recording.wav -map_metadata -1 -codec:a libmp3lame -q:a 2 final-artifacts/reference-complete.mp3
      - name: Exercise the real browser upload and saved result
        run: python scripts/verify_real_upload_browser.py final-artifacts/reference-complete.mp3 --output results/final-real-browser --timeout 180
      - name: Upload complete Git history
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-complete-repository
          path: |
            final-artifacts/dopplergeist-final.bundle
            final-artifacts/source-commit.txt
          if-no-files-found: error
          retention-days: 30
      - name: Preserve actual real results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-real-pipeline-and-browser
          path: |
            final-artifacts/restore.json
            results/final-real-pipeline/
            results/final-real-browser/*.json
            results/final-real-browser/*.png
            results/final-real-browser/*.log
            results/final-real-browser/jobs/**/worker.log
            results/final-real-browser/jobs/**/result.json
          if-no-files-found: error
          retention-days: 30

  nasa-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4b2485b7c2773665e8e180b6bf840eac3c187431
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the package without generated fixtures
        run: python -m pip install .
      - name: Retrieve and verify all four pinned original NASA files
        run: python scripts/download_nasa_cases.py --output data/nasa-originals
      - name: Prepare the measured session inputs
        run: python scripts/benchmark_nasa_session.py prepare --source-directory data/nasa-originals --case-manifest benchmarks/nasa-session-cases-20261103.json --output results/nasa/prepared
      - name: Run default discovery and conditional trajectory fits
        run: python scripts/benchmark_nasa_session.py search --inputs results/nasa/prepared/search-inputs.json --domain results/nasa/prepared/search-domain.json --output results/nasa/default
      - name: Evaluate frozen conditional modes
        run: python scripts/benchmark_nasa_session.py evaluate --search-directory results/nasa/default --truth results/nasa/prepared/evaluation-truth.json --output results/nasa/evaluation.json
      - name: Reproduce the fixed shorter-window negative comparison
        run: python scripts/benchmark_nasa_session.py search --inputs results/nasa/prepared/search-inputs.json --domain results/nasa/prepared/search-domain.json --output results/nasa/short-window --discovery-window-s 0.5 --discovery-hop-s 0.125
      - name: Preserve all actual NASA outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-nasa-measured-results
          path: |
            results/nasa/default/
            results/nasa/short-window/
            results/nasa/evaluation.json
            results/nasa/prepared/*.json
          if-no-files-found: error
          retention-days: 30
