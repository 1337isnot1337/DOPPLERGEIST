name: Real browser upload after response-capture correction
on:
  push:
    branches: [worker/e2e-nasa-highspeed-inputs-20261103]
    paths: [.github/workflows/e2e-real-final.yml]
permissions:
  contents: read
env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5cec67ca3a01731a3e8b16fd56daee926810cdfb
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve the complete updated repository
        run: |
          mkdir -p final-artifacts
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git bundle create final-artifacts/dopplergeist-final.bundle --all
          git rev-parse HEAD > final-artifacts/source-commit.txt
      - name: Install the published package and optional browser verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg gh
          python -m pip install . playwright
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Restore only the original real source recording
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_artifacts.py --bundle data-source.tar.gz --destination .
      - name: Convert the complete original without selecting events or bands
        run: ffmpeg -hide_banner -loglevel error -i data/source/reference-recording.wav -map_metadata -1 -codec:a libmp3lame -q:a 2 final-artifacts/reference-complete.mp3
      - name: Upload through Chromium and verify the saved real result
        run: python scripts/verify_real_upload_browser.py final-artifacts/reference-complete.mp3 --output results/final-real-browser --timeout 180
      - name: Preserve complete Git history
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-complete-repository
          path: |
            final-artifacts/dopplergeist-final.bundle
            final-artifacts/source-commit.txt
          if-no-files-found: error
          retention-days: 30
      - name: Preserve actual browser outputs, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-real-browser
          path: |
            results/final-real-browser/*.json
            results/final-real-browser/*.png
            results/final-real-browser/*.log
            results/final-real-browser/jobs/**/worker.log
            results/final-real-browser/jobs/**/result.json
          if-no-files-found: error
          retention-days: 30
