name: Retrieve real acoustic research inputs
on:
  push:
    branches: [worker/e2e-track-support-20261103]
    paths: [.github/workflows/e2e-real-input-fetch.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-real-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5582002be34e0e1e9df6735e7a4227ca4c0fc899
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata readers
        run: python -m pip install numpy scipy openpyxl
      - name: Retrieve original NASA members with bounded network retries
        run: |
          python - <<'PY'
          from pathlib import Path
          import runpy, sys, urllib.error, json
          script='scripts/inspect_nasa_flyover_release.py'
          namespace=runpy.run_path(script)
          archive=namespace['Archive']; original=archive.fetch
          failures=[]
          def fetch(self,*args,**kwargs):
              for attempt in range(1,4):
                  try:
                      return original(self,*args,**kwargs)
                  except (urllib.error.URLError, TimeoutError, ConnectionError) as exc:
                      if isinstance(exc,urllib.error.HTTPError) and exc.code<500: raise
                      item={'args':args,'kwargs':kwargs,'attempt':attempt,'error':type(exc).__name__+': '+str(exc)}
                      failures.append(item); print(json.dumps(item),flush=True)
                      Path('real-inputs').mkdir(exist_ok=True)
                      Path('real-inputs/network-failures.json').write_text(json.dumps(failures,indent=2)+'\n')
                      if attempt==3: raise
          archive.fetch=fetch
          sys.argv=[script,'--output','real-inputs/nasa','--first-fixed-wing']
          namespace['main']()
          PY
      - name: Package metadata reader wheels for offline inspection
        if: always()
        run: |
          python -m pip download --only-binary :all: --dest real-inputs/wheels openpyxl
      - name: Preserve original real inputs and retrieval receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-public-real-inputs
          path: real-inputs/
          retention-days: 7
          if-no-files-found: error
