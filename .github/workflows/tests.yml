name: Installation and static checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} installation and static checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime and package
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg build-essential
          CC=gcc python -m pip install '.[test]'
          python -m pip check
      # The owner requires real recordings for further validation. The historical
      # suite generates synthetic inputs. Only the captured real-input native
      # regression below is run; the historical suite remains disabled.
      - name: Compile source without executing experiments
        run: python -m compileall -q src scripts
      - name: CLI smoke check
        run: dopplergeist --help
      - name: Check installed modules and packaged browser assets
        run: |
          python -I - <<'PY'
          from importlib import resources
          from pathlib import Path
          import dopplergeist
          from dopplergeist import automatic, jobs, matching, service

          package = Path(dopplergeist.__file__).resolve().parent
          assert "site-packages" in package.parts, package
          assert matching._native_fit_irls is not None, matching.RIDGE_FIT_BACKEND
          assert matching.RIDGE_FIT_BACKEND.startswith("native-c-"), matching.RIDGE_FIT_BACKEND
          web = resources.files("dopplergeist.web")
          for name in ("index.html", "app.js", "style.css"):
              assert web.joinpath(name).is_file(), name
              assert web.joinpath(name).read_bytes(), name
          print("Installed package imports and browser assets passed; no audio or tracks generated.")
          PY
      - name: Check exact native arithmetic on recorded inputs
        run: python -I -m pytest -q tests/test_real_native_ridge.py
