name: Installation and static checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} installation and static checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime and package
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install .
          python -m pip check
      # The owner requires real recordings for further validation. The historical
      # pytest suite generates synthetic inputs, so this workflow does not run it.
      - name: Compile source without executing experiments
        run: python -m compileall -q src scripts
      - name: CLI smoke check
        run: dopplergeist --help
      - name: Check installed native validator and packaged browser assets
        run: |
          python -I - <<'PY'
          from importlib import resources
          import json
          from pathlib import Path
          import dopplergeist
          from dopplergeist import _native_cpa, _native_index, _native_ridge, automatic, jobs, service

          package = Path(dopplergeist.__file__).resolve().parent
          assert "site-packages" in package.parts, package
          assert Path(_native_ridge.__file__).resolve().parent == package
          assert Path(_native_cpa.__file__).resolve().parent == package
          assert Path(_native_index.__file__).resolve().parent == package
          observed = json.loads(Path("research/trajectory-motion/frozen/fresh-a6cc10.json").read_text())
          assert _native_index.payload_columns(observed) is not None, "Native real-column extraction failed"
          assert callable(_native_ridge.fit_irls_batch), "Native batch fitter did not build"
          assert callable(_native_ridge.fit_statistics), "Native fit counters did not build"
          assert callable(_native_cpa.select), "Native CPA reducer did not build"
          assert callable(getattr(_native_ridge, "event_fit_reason", None)), "Native evidence validator did not build"
          assert callable(getattr(_native_ridge, "valid_ridge_events", None)), "Native boolean validator did not build"
          fixture = json.loads(Path("tests/data/real-ridge-batch-arithmetic.json").read_text())
          fits = fixture["legacy_diagnostics"]
          assert _native_ridge.event_fit_reason(
              fits, [fit["score"] for fit in fits], [fit["f0_hz"] for fit in fits],
              [fixture["event"]] * len(fits)) == 0
          assert _native_ridge.valid_ridge_events(
              fits, [fit["score"] for fit in fits], [fit["f0_hz"] for fit in fits],
              [fixture["event"]] * len(fits)) is True
          web = resources.files("dopplergeist.web")
          for name in ("index.html", "app.js", "style.css"):
              assert web.joinpath(name).is_file(), name
              assert web.joinpath(name).read_bytes(), name
          print("Installed native validation of recorded fits and browser assets passed; no audio or tracks generated.")
          PY
