name: Export source provenance metadata
on:
  push:
    branches: [worker/local-verification-export-7a37d350]
    paths: [.github/workflows/local-verification-export.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Restore checksummed source archive and export selected provenance
        env:
          GH_TOKEN: ${{ github.token }}
          METADATA_WORK_DIRECTORY: ${{ runner.temp }}/dopplergeist-metadata
          EXPORT_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, os, shutil, subprocess
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("restorer", "scripts/restore_artifacts.py")
          restorer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(restorer)
          restorer.REPOSITORY = os.environ["EXPORT_REPOSITORY"]
          root = Path(os.environ["METADATA_WORK_DIRECTORY"])
          cache, restored, output = root / "cache", root / "restored", root / "export"
          for path in (cache, restored, output):
              path.mkdir(parents=True, exist_ok=False)
          manifest_path = Path("evidence/artifact-manifest.json")
          manifest = json.loads(manifest_path.read_text())
          asset = next(item for item in manifest["assets"] if item["name"] == "data-source.tar.gz")
          archive = restorer.download_asset(asset, cache)
          restoration = restorer.restore_asset(archive, asset, restored)
          selected = ("data/source/reference-recording.info.json", "data/source/transcript.txt",
                      "data/source/video.info.json", "data/source/true_camera.png",
                      "data/source/source-1441.png", "data/source/source_manifest.json")
          entries = {entry["path"]: entry for entry in asset["files"] if entry["path"] in selected}
          if set(entries) != set(selected):
              raise ValueError("Required metadata is absent from the release manifest")
          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          for name in selected:
              source, target = restored / name, output / name
              entry = entries[name]
              if source.is_symlink() or not source.is_file() or source.stat().st_size != entry["bytes"] or digest(source) != entry["sha256"]:
                  raise ValueError("Restored provenance does not match the release: " + name)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
              if digest(target) != entry["sha256"]:
                  raise ValueError("Exported provenance changed: " + name)
          receipt = {"schema_version": 1, "status": "passed", "files": list(entries.values()),
              "checkout_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "release_tag": restorer.TAG, "release_asset": asset["name"], "release_asset_sha256": asset["sha256"],
              "release_manifest_sha256": digest(manifest_path), "restoration": restoration,
              "source_mp4_included": False, "audio_included": False,
              "scope": "Unchanged released descriptive metadata and source screenshots; no recorder truth is inferred."}
          (output / "provenance-export.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dopplergeist-source-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dopplergeist-metadata/export/
          if-no-files-found: error
          retention-days: 30
